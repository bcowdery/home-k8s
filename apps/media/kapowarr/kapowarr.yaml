apiVersion: v1
kind: ConfigMap
metadata:
  name: kapowarr-config
  namespace: media
  labels:
    app: kapowarr
data:
  PUID: "1000"
  PGID: "1000"
  TZ: "America/Halifax"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kapowarr-deployment
  namespace: media
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kapowarr
  template:
    metadata:
      labels:
        app: kapowarr
      namespace: media
    spec:
      restartPolicy: Always
      containers:
        - name: kapowarr
          image: mrcas/kapowarr:v1.3.2
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 1000m
              ephemeral-storage: 10Gi
          envFrom:
            - configMapRef:
                name: kapowarr-config
          ports:
            - name: http-web
              protocol: TCP
              containerPort: 5656
          startupProbe:
            tcpSocket:
              port: http-web
            failureThreshold: 60    # 10s x 60 = 10min
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http-web
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http-web
            initialDelaySeconds: 15
            periodSeconds: 5
          volumeMounts:
            - mountPath: "/app/db"
              name: kapowarr-data
            # root folder in Kapowarr: /comics (/volume1/media/comics on the NAS)
            - mountPath: "/comics"
              name: shared-media
              subPath: comics
            # same NFS share as /comics so finished downloads move instead of copy
            - mountPath: "/app/temp_downloads"
              name: shared-media
              subPath: downloads/kapowarr
      volumes:
        - name: kapowarr-data
          persistentVolumeClaim:
            claimName: kapowarr-data
        - name: shared-media
          persistentVolumeClaim:
            claimName: shared-media-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: kapowarr-tcp
  namespace: media
  labels:
    app: kapowarr
spec:
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http-web
    - name: http-web
      protocol: TCP
      port: 5656
      targetPort: http-web
  selector:
    app: kapowarr
