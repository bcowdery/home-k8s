apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kapowarr
  namespace: media
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: kapowarr.home.pointyspoon.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kapowarr-tcp
                port:
                  number: 5656
