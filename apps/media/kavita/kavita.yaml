apiVersion: v1
kind: ConfigMap
metadata:
  name: kavita-config
  namespace: media
  labels:
    app: kavita
data:
  PUID: "1000"
  PGID: "1000"
  TZ: "America/Halifax"
---


apiVersion: apps/v1
kind: Deployment
metadata:
  name: kavita-deployment
  namespace: media
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kavita
  template:
    metadata:
      labels:
        app: kavita
      namespace: media
    spec:
      restartPolicy: Always
      containers:
        - name: kavita
          image: linuxserver/kavita:latest
          resources:
            requests:
              memory: 1Gi
              cpu: 500m
            limits:
              memory: 2Gi
              cpu: 1000m
              ephemeral-storage: 10Gi
          envFrom:
            - configMapRef:
                name: kavita-config
          ports:
            - name: http-web
              protocol: TCP
              containerPort: 5000
          # liveness and readiness only start once this passes, so a slow first start
          # (database upgrade) is not killed halfway through
          startupProbe:
            tcpSocket:
              port: http-web
            failureThreshold: 60    # 10s x 60 = 10min
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http-web
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http-web
            initialDelaySeconds: 15
            periodSeconds: 5
          volumeMounts:
            - mountPath: "/config"
              name: kavita-data
            - mountPath: "/mnt/media"
              name: shared-media
      volumes:
        - name: kavita-data
          persistentVolumeClaim:
            claimName: kavita-data
        - name: shared-media
          persistentVolumeClaim:
            claimName: shared-media-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: kavita-tcp
  namespace: media
  labels:
    app: kavita
spec:
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http-web
    - name: http-web
      protocol: TCP
      port: 5000
      targetPort: http-web
  selector:
    app: kavita
