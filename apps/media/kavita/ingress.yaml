apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kavita
  namespace: media
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: kavita.home.pointyspoon.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kavita-tcp
                port:
                  number: 5000
