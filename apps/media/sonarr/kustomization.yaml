apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - sonarr.yaml
  - pvc.yaml
  - ingress.yaml
# metadata only: labels are not added to selectors or pod templates, so nothing restarts
labels:
  - pairs:
      app.kubernetes.io/name: sonarr
      app.kubernetes.io/part-of: media
patches:
  # shows as a clickable link on the Service in the Argo CD UI
  - target:
      kind: Service
      name: sonarr-tcp
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: sonarr-tcp
        annotations:
          link.argocd.argoproj.io/external-link: https://sonarr.home.pointyspoon.com
