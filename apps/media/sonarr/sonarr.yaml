apiVersion: v1
kind: ConfigMap
metadata:
  name: sonarr-config
  namespace: media
  labels:
    app: sonarr
data:
  PUID: "1000"
  PGID: "1000"
  TZ: "America/Halifax"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr-deployment
  namespace: media
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
      namespace: media
    spec:
      restartPolicy: Always
      containers:
      - name: sonarr
        image: linuxserver/sonarr:latest
        # resources:
        #   requests:
        #     memory: 2Gi
        #     cpu: 200m
        #   limits:
        #     memory: 4Gi
        #     cpu: 500m
        envFrom:
          - configMapRef:
              name: sonarr-config
        ports:
          - name: http-web
            protocol: TCP
            containerPort: 8989
        volumeMounts:
          - mountPath: "/config"
            name: sonarr-data
          - mountPath: "/mnt/media"
            name: shared-media
      volumes:
        - name: sonarr-data
          persistentVolumeClaim:
            claimName: sonarr-data
        - name: shared-media
          persistentVolumeClaim:
            claimName: shared-media-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr-tcp
  namespace: media
  labels:
    app: sonarr
spec:
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http-web
    - name: http-web
      protocol: TCP
      port: 8989
      targetPort: http-web
  selector:
    app: sonarr
---
# Hyphen-free alias for Home Assistant. Its Sonarr integration uses the aiopyarr library, which
# cuts any hostname at the first "-" (sonarr-tcp.media... becomes sonarr-:8989/tcp.media...), so it
# cannot use the sonarr-tcp Service. Use http://sonarr.media.svc.cluster.local:8989
apiVersion: v1
kind: Service
metadata:
  name: sonarr
  namespace: media
  labels:
    app: sonarr
spec:
  type: ClusterIP
  ports:
    - name: http-web
      protocol: TCP
      port: 8989
      targetPort: http-web
  selector:
    app: sonarr
