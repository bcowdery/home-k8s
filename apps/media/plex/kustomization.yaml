apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - plex.yaml
# metadata only: labels are not added to selectors or pod templates, so nothing restarts
labels:
  - pairs:
      app.kubernetes.io/name: plex
      app.kubernetes.io/part-of: media
patches:
  # shows as a clickable link on the Service in the Argo CD UI
  - target:
      kind: Service
      name: plex-tcp
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: plex-tcp
        annotations:
          link.argocd.argoproj.io/external-link: http://192.168.1.203:32400/web
