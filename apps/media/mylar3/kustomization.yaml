apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - mylar3.yaml
  - pvc.yaml
  - ingress.yaml
# metadata only: labels are not added to selectors or pod templates, so nothing restarts
labels:
  - pairs:
      app.kubernetes.io/name: mylar3
      app.kubernetes.io/part-of: media
patches:
  # shows as a clickable link on the Service in the Argo CD UI
  - target:
      kind: Service
      name: mylar-tcp
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: mylar-tcp
        annotations:
          link.argocd.argoproj.io/external-link: http://192.168.1.207:8090
