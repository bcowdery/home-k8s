apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nzbget
  namespace: media
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: nzbget.home.pointyspoon.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nzbget-tcp
                port:
                  number: 6789
