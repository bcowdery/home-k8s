apiVersion: v1
kind: Secret
metadata:
  name: nzbget-passwd
  namespace: media
  labels:
    app: nzbget
type: Opaque
data:
  username: "YWRtaW4="
  password: "cm9iZXJ0amY="
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nzbget-config
  namespace: media
  labels:
    app: nzbget
data:
  PUID: "1000"
  PGID: "1000"
  TZ: "America/Halifax"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nzbget-deployment
  namespace: media
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nzbget
  template:
    metadata:
      labels:
        app: nzbget
      namespace: media
    spec:
      restartPolicy: Always
      containers:
        - name: nzbget
          image: linuxserver/nzbget:latest
          resources:
            requests:
              memory: 1Gi
              cpu: 500m
            limits:
              memory: 2Gi
              cpu: 1000m
              ephemeral-storage: 10Gi
          envFrom:
            - configMapRef:
                name: nzbget-config
          env:
            - name: NZBGET_USER
              valueFrom:
                secretKeyRef:
                  name: nzbget-passwd
                  key: username
            - name: NZBGET_PASS
              valueFrom:
                secretKeyRef:
                  name: nzbget-passwd
                  key: password
          ports:
            - name: http-web
              protocol: TCP
              containerPort: 6789
          # liveness and readiness only start once this passes, so a slow first start
          # (database upgrade) is not killed halfway through
          startupProbe:
            tcpSocket:
              port: http-web
            failureThreshold: 60    # 10s x 60 = 10min
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http-web
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http-web
            initialDelaySeconds: 15
            periodSeconds: 5
          volumeMounts:
            - mountPath: "/config"
              name: nzbget-data
            - mountPath: "/intermediate"
              name: nzbget-intermediate
            - mountPath: "/mnt/media"
              name: shared-media
      volumes:
        - name: nzbget-data
          persistentVolumeClaim:
            claimName: nzbget-data
        - name: nzbget-intermediate
          emptyDir:                       # size of files being downloaded + failed downloads
            sizeLimit: 80Gi               # assume bluray remux ~50Gi
        - name: shared-media
          persistentVolumeClaim:
            claimName: shared-media-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: nzbget-tcp
  namespace: media
  labels:
    app: nzbget
spec:
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http-web
    - name: http-web
      protocol: TCP
      port: 6789
      targetPort: http-web
  selector:
    app: nzbget
