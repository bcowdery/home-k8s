apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kometa-data
  namespace: media
  annotations:
    # never let Argo CD delete a volume claim if its manifest is removed from git
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app: kometa
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: synology-csi-iscsi-retain
  resources:
    requests:
      storage: 2Gi
