apiVersion: v1
kind: ConfigMap
metadata:
  name: mylar-config
  namespace: media
  labels:
    app: mylar
data:
  PUID: "1000"
  PGID: "1000"
  TZ: "America/Edmonton"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mylar-deployment
  namespace: media
spec:
  replicas: 0   # parked, set to 1 to run
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mylar
  template:
    metadata:
      labels:
        app: mylar
      namespace: media
    spec:
      restartPolicy: Always
      containers:
        - name: mylar
          image: linuxserver/mylar3:latest
          resources:
            requests:
              memory: 1Gi
              cpu: 500m
            limits:
              memory: 2Gi
              cpu: 1000m
              ephemeral-storage: 10Gi
          envFrom:
            - configMapRef:
                name: mylar-config
          ports:
            - name: http-web
              protocol: TCP
              containerPort: 8090
          readinessProbe:
            tcpSocket:
              port: http-web
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http-web
            initialDelaySeconds: 15
            periodSeconds: 5
          volumeMounts:
            - mountPath: "/config"
              name: mylar-data
            - mountPath: "/mnt/media"
              name: shared-media
      volumes:
        - name: mylar-data
          iscsi:
            targetPortal: "192.168.1.2"
            iqn: "iqn.2025-06.com.synology:deepthought.mylar-1"
            lun: 1
            fsType: ext4
            readOnly: false
        - name: shared-media
          persistentVolumeClaim:
            claimName: shared-media-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mylar-tcp
  namespace: media
  labels:
    app: mylar
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.207
  externalTrafficPolicy: Local
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http-web
    - name: http-web
      protocol: TCP
      port: 8090
      targetPort: http-web
  selector:
    app: mylar
