apiVersion: v1
kind: Namespace
metadata:
  name: synology-csi
  labels:
    app.kubernetes.io/part-of: core
  annotations:
    kubernetes.io/description: Synology CSI driver, provisions iSCSI volumes on the NAS
    # never let Argo CD delete a namespace if its manifest is removed from git
    argocd.argoproj.io/sync-options: Prune=false
