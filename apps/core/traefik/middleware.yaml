# Applied to the websecure entrypoint, so every route on it is limited to the LAN. The gateway
# forwards WAN 443 only to the separate public entrypoint (9443), never to websecure, so this is
# the second lock.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: traefik
  annotations:
    # on a fresh cluster the CRD lands in the same sync as this object
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  ipAllowList:
    sourceRange:
      - 192.168.0.0/16
