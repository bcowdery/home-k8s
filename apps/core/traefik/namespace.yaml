apiVersion: v1
kind: Namespace
metadata:
  name: traefik
  labels:
    app.kubernetes.io/part-of: core
  annotations:
    kubernetes.io/description: Traefik, the single ingress for the LAN web UIs (Plex keeps its own IP)
    # never let Argo CD delete a namespace if its manifest is removed from git
    argocd.argoproj.io/sync-options: Prune=false
