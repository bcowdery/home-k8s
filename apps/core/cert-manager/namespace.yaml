apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    app.kubernetes.io/part-of: core
  annotations:
    kubernetes.io/description: Certificates for the cluster (today only the Intel device plugins webhook)
    # never let Argo CD delete a namespace if its manifest is removed from git
    argocd.argoproj.io/sync-options: Prune=false
