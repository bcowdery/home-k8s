apiVersion: v1
kind: Namespace
metadata:
  name: node-feature-discovery
  labels:
    app.kubernetes.io/part-of: core
  annotations:
    kubernetes.io/description: Node Feature Discovery, labels nodes with hardware features such as the Intel GPU
    # never let Argo CD delete a namespace if its manifest is removed from git
    argocd.argoproj.io/sync-options: Prune=false
