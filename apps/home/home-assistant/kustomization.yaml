apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - home-assistant.yaml
  - ingress.yaml
# metadata only: labels are not added to selectors or pod templates, so nothing restarts
labels:
  - pairs:
      app.kubernetes.io/name: home-assistant
      app.kubernetes.io/part-of: home
patches:
  # shows as a clickable link on the Service in the Argo CD UI
  - target:
      kind: Service
      name: home-assistant
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: home-assistant
        annotations:
          link.argocd.argoproj.io/external-link: https://ha.home.pointyspoon.com
