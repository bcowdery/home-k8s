apiVersion: v1
kind: Namespace
metadata:
  name: home-assistant
  labels:
    app.kubernetes.io/part-of: home
  annotations:
    kubernetes.io/description: Home Assistant and the voice services it talks to (Whisper, Piper)
    # never let Argo CD delete a namespace if its manifest is removed from git
    argocd.argoproj.io/sync-options: Prune=false
