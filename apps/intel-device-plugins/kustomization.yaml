apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
helmCharts:
  - name: intel-device-plugins-operator
    repo: https://intel.github.io/helm-charts/
    version: 0.28.0
    releaseName: dp-operator
    namespace: inteldeviceplugins-system
    includeCRDs: true
  - name: intel-device-plugins-gpu
    repo: https://intel.github.io/helm-charts/
    version: 0.28.0
    releaseName: gpu
    namespace: inteldeviceplugins-system
    includeCRDs: true
    valuesInline:
      nodeFeatureRule: true
# the chart renders `labels: null` on three rules, which server-side apply rejects.
# The API server dropped those nulls when Helm first applied them, so live has no key.
patches:
  - target:
      kind: NodeFeatureRule
      name: intel-gpu-platform-labeling
    patch: |-
      - op: remove
        path: /spec/rules/1/labels
      - op: remove
        path: /spec/rules/2/labels
      - op: remove
        path: /spec/rules/3/labels
