# One Argo CD Application per directory under apps/. Adding a component means
# adding a directory with a kustomization.yaml; nothing else needs to change.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/bcowdery/home-k8s.git
        revision: main
        directories:
          - path: apps/*
  template:
    metadata:
      name: '{{ .path.basename }}'
    spec:
      project: default
      source:
        repoURL: https://github.com/bcowdery/home-k8s.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        # namespaces are set on the resources themselves
      syncPolicy:
        automated:
          prune: false     # turn on once the setup has proven itself
          selfHeal: true
        syncOptions:
          - ServerSideApply=true            # large CRDs exceed the client-side annotation limit
          - RespectIgnoreDifferences=true
        retry:
          limit: 8         # tolerates CRDs and secrets landing after the apps that use them
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
      # controllers (MetalLB, cert-manager, ...) inject the real CA into these
      ignoreDifferences:
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jqPathExpressions:
            - .spec.conversion.webhook.clientConfig.caBundle
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
